name: SonarQube Cloud

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master

jobs:
  sonar:
    name: Analyse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Volledige history: Sonar gebruikt git blame om issues aan een auteur
          # en aan een datum te koppelen (nodig voor "new code").
          fetch-depth: 0

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=SebastiaanvanOorschot_HobbyHub
            -Dsonar.organization=sebastiaanvanoorschot
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/dist/**
